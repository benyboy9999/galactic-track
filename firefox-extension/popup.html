<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      background: #0a0a18;
      color: #d8d8f0;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header img { width: 22px; height: 22px; }
    .header-text { font-size: 13px; font-weight: 600; color: #d8d8f0; }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .dot.on  { background: #22c55e; }
    .dot.off { background: #ef4444; }
    .status-label {
      font-size: 12px;
      font-weight: 600;
      transition: color 0.2s;
    }
    .status-label.on  { color: #22c55e; }
    .status-label.off { color: #ef4444; }

    .info-line {
      font-size: 11px;
      color: #6b6b8a;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .info-line span { color: #9090b0; }

    /* Toggle slider */
    .toggle-wrap { flex-shrink: 0; }
    .toggle-wrap input { display: none; }
    .toggle-track {
      display: block;
      width: 36px;
      height: 20px;
      background: #2a2a4a;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      background: #6b6b8a;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .toggle-track { background: #166534; }
    input:checked + .toggle-track::after {
      transform: translateX(16px);
      background: #22c55e;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="GTE48.png" alt="" />
    <div class="header-text">Galactic Track</div>
  </div>

  <div class="status-row">
    <div class="status-left">
      <span class="dot" id="dot"></span>
      <span class="status-label" id="status-label">—</span>
    </div>
    <label class="toggle-wrap">
      <input type="checkbox" id="toggle" />
      <span class="toggle-track"></span>
    </label>
  </div>

  <div class="info-line" id="info-line" style="display:none">
    [<span id="info-guild">—</span>] <span id="info-company">—</span>
  </div>

  <div style="margin-top:8px; padding-top:8px; border-top:1px solid #1a1a30; color:#6b6b8a; font-size:11px; line-height:1.5;">
    API key and settings are managed via the <span style="color:#9090b0;">&#9881; Settings</span> panel on the game page.
  </div>

<script src="popup.js"></script>
</body>
</html>
