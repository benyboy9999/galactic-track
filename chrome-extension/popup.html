<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      background: #0a0a18;
      color: #d8d8f0;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header img { width: 22px; height: 22px; }
    .header-text { font-size: 13px; font-weight: 600; color: #d8d8f0; }
    button {
      width: 100%;
      padding: 8px 0;
      background: transparent;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #6b6b8a;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { border-color: #4a4a6a; color: #9090b0; }
    .connected-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #22c55e;
      margin-bottom: 4px;
    }
    .connected-company {
      font-size: 12px;
      color: #b0b0cc;
      margin-bottom: 12px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .not-connected {
      font-size: 11px;
      color: #4a4a6a;
      margin-bottom: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="GTE48.png" alt="" />
    <div>
      <div class="header-text">Galactic Track Extension</div>
    </div>
  </div>

  <div id="view-connected" style="display:none">
    <div class="connected-status"><span class="dot"></span>Connected</div>
    <div class="connected-company">[<span id="info-guild">—</span>] <span id="info-company">—</span></div>
    <button id="btn-reset">Sign Out</button>
  </div>

  <div id="view-not-connected">
    <div class="not-connected">Visit an exchange page in Galactic Tycoons to connect automatically.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
