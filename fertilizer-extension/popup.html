<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 200px;
      background: #0a0a18;
      color: #d8d8f0;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header-text { font-size: 13px; font-weight: 600; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .label { font-size: 12px; color: #9090b0; }
    .toggle-wrap { flex-shrink: 0; }
    .toggle-wrap input { display: none; }
    .toggle-track {
      display: block;
      width: 36px;
      height: 20px;
      background: #2a2a4a;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      background: #6b6b8a;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .toggle-track { background: #166534; }
    input:checked + .toggle-track::after {
      transform: translateX(16px);
      background: #22c55e;
    }
    .note {
      font-size: 10px;
      color: #4a4a6a;
      line-height: 1.4;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🌱</span>
    <span class="header-text">Fertilizer Advisor</span>
  </div>

  <div class="row">
    <span class="label">Show panel</span>
    <label class="toggle-wrap">
      <input type="checkbox" id="toggle" />
      <span class="toggle-track"></span>
    </label>
  </div>

  <div class="note" id="note">
    Open the game page to use this extension.
  </div>

<script src="popup.js"></script>
</body>
</html>
